name: Actualizar datos presupuestarios

on:
  schedule:
    - cron: '0 8 * * 1'  # Cada lunes a las 8:00 UTC
  workflow_dispatch:      # Permite ejecución manual desde GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener datos de MINFIN y guardar JSON
        run: node scripts/fetch-budget.mjs

      - name: Commit si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/chimaltenango_presupuesto_*.json src/data/config.json
          git diff --staged --quiet || git commit -m "data: actualizar presupuesto $(date +%Y-%m-%d)"
          git push
